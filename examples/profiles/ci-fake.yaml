# The deterministic fake profile: every adapter points at the stdlib-only fake
# harnesses so CI and local deterministic runs share one profile shape
# (plan section 6). Relative executable/config_home values resolve against
# this file's directory.
schema_version: 1
kind: harness-profile-set
default_harness: claude-code
profiles:
  - harness: claude-code
    executable: ../../fixtures/fake-harness/fake_claude.py
    config_home: .agentteam-local/vendors/claude-code
    proxy_policy: inherit
    environment:
      config_home_variable: CLAUDE_CONFIG_DIR
      passthrough: [FAKE_OBSERVE, FAKE_MODE, FAKE_MODE_CLAUDE, FAKE_MODE_CODEX, FAKE_MODE_GROK, FAKE_PROBE_MODE, FAKE_PROBE_MODE_CLAUDE]
      conflicts: [FAKE_CONFLICT]
    capabilities:
      - {name: headless-json, verification: verified, cli_version: "2.1.241 (Claude Code)", verified_at: "2026-08-23T00:00:00Z"}
      - {name: structured-output, verification: verified, cli_version: "2.1.241 (Claude Code)", verified_at: "2026-08-23T00:00:00Z"}
      - {name: native-auth, verification: verified, cli_version: "2.1.241 (Claude Code)", verified_at: "2026-08-23T00:00:00Z"}
      - {name: append-system-prompt-file, verification: verified, cli_version: "2.1.241 (Claude Code)", verified_at: "2026-08-23T00:00:00Z"}
      - {name: skills-config-home, verification: verified, cli_version: "2.1.241 (Claude Code)", verified_at: "2026-08-23T00:00:00Z"}
