# Scaffold smoke matrix (M1a plan section 16). The workflow grows gate by
# gate: G3 adds adapter tests and the Windows .cmd fake, G4 adds deterministic
# acceptance / hash identity / optional ClawTeam jobs, G5 fills that optional
# job with provider conformance and lifecycle coverage, and G7 runs the final
# matrices plus vendor smoke. No vendor login, model call, API key, or secret
# is ever used here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    name: scaffold (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      UV_NO_PROGRESS: "1"
      NO_COLOR: "1"
      TERM: dumb
      # Beats the repo's .python-version so the 3.13 legs really run 3.13.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Force LF-authoritative checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Install matrix Python (managed; independent of the runner image)
        run: uv python install ${{ matrix.python }}
      - name: Show selected interpreter
        run: uv python find ${{ matrix.python }}
      - name: Lock consistency
        run: uv lock --check
      - name: Sync (frozen, all groups; never --all-extras)
        run: uv sync --frozen --all-groups
      - name: Assert matrix Python
        run: uv run --no-sync python -c "import sys; want = tuple(map(int, '${{ matrix.python }}'.split('.'))); assert sys.version_info[:2] == want, sys.version"
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Format check
        run: uv run --no-sync ruff format --check .
      - name: Typecheck
        run: uv run --no-sync mypy
      - name: Tests
        run: uv run --no-sync pytest
      - name: M1c interactive deterministic acceptance
        run: |
          uv run --no-sync pytest \
            tests/unit/test_interactive_contracts.py \
            tests/unit/test_library_migration.py \
            tests/integration/test_cli_library.py \
            tests/unit/test_direct_acp_runtime.py \
            tests/integration/test_cli_runtime.py \
            tests/integration/test_interactive_controller.py \
            tests/integration/test_execution_providers.py \
            tests/integration/test_direct_acp_bridge.py \
            tests/unit/test_interactive_workspace_permissions.py
      - name: Build
        run: uv build
      - name: Schema reproduction check
        run: uv run --no-sync python -m agentteam.schema check
      - name: Schema export round-trip is clean
        run: |
          uv run --no-sync python -m agentteam.schema export
          git diff --exit-code -- schemas
      - name: CLI --help / --version
        run: |
          uv run --no-sync atm --help
          uv run --no-sync atm --version
      - name: CLI deterministic smoke (validate + render-only, fakes only)
        run: |
          uv run --no-sync atm assistant validate examples/assistants/code-reviewer --strict-content
          uv run --no-sync atm team validate examples/teams/development.yaml --json
          uv run --no-sync atm run --assistant examples/assistants/code-reviewer \
            --workspace fixtures/fake-harness --task-file README.md \
            --config examples/profiles/ci-fake.yaml \
            --harness claude-code --harness codex --harness grok \
            --render-only --output-dir "$RUNNER_TEMP/render-smoke"
          uv run --no-sync atm run examples/run-requests/team-review.yaml \
            --config examples/profiles/ci-fake.yaml \
            --render-only --output-dir "$RUNNER_TEMP/team-render-smoke"
      - name: Example-package hash identity (cross-OS pin, section 16)
        run: |
          uv run --no-sync python -c "
          from pathlib import Path
          from agentteam.resolution.archive import hash_package
          pinned = 'fd54eae7dbaa570aed693332e10c7260e8974c5354026b2c087a0f8395c9c0fe'
          digest = hash_package(Path('examples/assistants/code-reviewer'))
          assert digest.package_hash == pinned, digest.package_hash
          print('example-package hash identity holds:', pinned)
          "
      - name: Deterministic direct + team acceptance via the CLI (sections 13-14)
        env:
          AGENTTEAM_HOME: ${{ runner.temp }}/agentteam-home
          FAKE_MODE: ok
        run: |
          # The fake profile's config homes are disposable (tests/conftest.py
          # provisions them for pytest and removes them afterwards); the G5
          # live preflight requires them to exist before any launch.
          mkdir -p examples/profiles/.agentteam-local/vendors/claude-code \
                   examples/profiles/.agentteam-local/vendors/codex \
                   examples/profiles/.agentteam-local/vendors/grok
          uv run --no-sync atm run examples/run-requests/direct-review.yaml \
            --config examples/profiles/ci-fake.yaml \
            --output-dir "$RUNNER_TEMP/acceptance-run"
          uv run --no-sync atm run examples/run-requests/team-review.yaml \
            --config examples/profiles/ci-fake.yaml \
            --output-dir "$RUNNER_TEMP/team-acceptance-run"
          uv run --no-sync python -c "
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'acceptance-run'
          run = json.loads((root / 'run.json').read_text(encoding='utf-8'))
          assert run['status'] == 'succeeded', run
          ensemble = json.loads((root / 'ensemble.json').read_text(encoding='utf-8'))
          assert ensemble['acceptance']['mechanical']['passed'] is True, ensemble
          assert ensemble['acceptance']['semantic']['passed'] is True, ensemble
          print('deterministic acceptance: both tiers PASS')
          team_root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'team-acceptance-run'
          team = json.loads((team_root / 'run.json').read_text(encoding='utf-8'))
          assert team['status'] == 'succeeded', team
          assert [row['status'] for row in team['tasks']] == ['completed'] * 3, team
          assert [row['workspace_access'] for row in team['tasks']] == [
              'read-only', 'workspace-write', 'read-only'
          ], team
          assert any(row['selection']['decided_by'] == 'team' for row in team['members']), team
          snapshot = team_root / team['substrate']['snapshot']['path']
          assert hashlib.sha256(snapshot.read_bytes()).hexdigest() == team['substrate']['snapshot']['sha256']
          deliverable = team_root / 'legs/inv-implementer/deliverables/implementation.txt'
          assert hashlib.sha256(deliverable.read_bytes()).hexdigest() == 'd3b0ba50d3d0f0029e079a1aa9adc0014535236933f80050c0e6a0acf5b903fd'
          assert len((team_root / 'coordination/messages.jsonl').read_text(encoding='utf-8').splitlines()) == 1
          print('deterministic team lifecycle: tasks, grants, snapshot, deliverable, and ledger PASS')
          "

  # Optional provider matrix (plan sections 10 and 16): the exactly pinned
  # ClawTeam extra, compatibility tests only, temporary data/config fixtures.
  # A failure here never contaminates the direct core; the core legs above
  # never install the extra and prove the suite skips cleanly without it.
  clawteam:
    name: clawteam (${{ matrix.os }}, py3.11)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      UV_NO_PROGRESS: "1"
      NO_COLOR: "1"
      TERM: dumb
      UV_PYTHON: "3.11"
    steps:
      - name: Force LF-authoritative checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Install matrix Python (managed; independent of the runner image)
        run: uv python install 3.11
      - name: Sync with the optional provider extra
        run: uv sync --frozen --all-groups --extra clawteam
      - name: ClawTeam qualification + provider conformance + lifecycle
        run: uv run --no-sync pytest tests/compatibility

  # G7 vendor smoke (plan section 16): npm-installed Claude Code and Codex
  # through the real launchers — install presence, --version, and required
  # flag surfaces only. No login, no model call, no secret. Doctor exit 1
  # (signed-out auth, no verified capability rows) is the designed green;
  # exit 2 (invalid profile or a set credential-shaped conflict variable)
  # fails the job. Grok is skipped: no verified non-interactive installer
  # as of 2026-08-24 (RISKS R27/R33; revisit on a new Grok CLI release).
  vendor-smoke:
    name: vendor-smoke (${{ matrix.os }}, py3.11)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      UV_NO_PROGRESS: "1"
      NO_COLOR: "1"
      TERM: dumb
      UV_PYTHON: "3.11"
    steps:
      - name: Force LF-authoritative checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Install matrix Python (managed; independent of the runner image)
        run: uv python install 3.11
      - name: Sync (frozen, all groups)
        run: uv sync --frozen --all-groups
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install vendor CLIs from npm (latest; no login, no model call)
        # @openai/codex is the only correct Codex package; the unscoped npm
        # name "codex" is an unrelated project and must never be installed.
        # A deprecation notice on @anthropic-ai/claude-code (the vendor now
        # prefers native installers) is tolerated; this job asserts launcher
        # mechanics against the npm artifacts, not versions.
        run: npm install -g @anthropic-ai/claude-code @openai/codex
      - name: Vendor CLIs respond on PATH (record observed versions)
        run: |
          claude --version
          codex --version
          npm ls -g --depth=0 || true
      - name: Create disposable vendor config homes (gitignored)
        run: |
          mkdir -p examples/profiles/.agentteam-local/vendor-smoke/claude-code \
                   examples/profiles/.agentteam-local/vendor-smoke/codex
      - name: Profile set validates
        run: uv run --no-sync atm profile validate --config examples/profiles/ci-vendor.yaml
      - name: Doctor through the real launchers (exit 1 signed-out is the designed green)
        run: |
          status=0
          uv run --no-sync atm profile doctor \
            --config examples/profiles/ci-vendor.yaml --json \
            > "$RUNNER_TEMP/vendor-doctor.json" || status=$?
          echo "doctor exit: $status"
          cat "$RUNNER_TEMP/vendor-doctor.json"
          test "$status" -eq 0 -o "$status" -eq 1
          uv run --no-sync python -c "
          import json, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'vendor-doctor.json'
          rows = json.loads(path.read_text(encoding='utf-8'))['profiles']
          assert [row['harness'] for row in rows] == ['claude-code', 'codex'], rows
          for row in rows:
              assert row['executable_resolved'] is True, row
              assert isinstance(row['version'], str) and row['version'].strip(), row
              assert row['config_home_exists'] is True, row
              assert row['conflicts_set'] == [], row
              assert row['required_flags_missing'] == [], row
              assert row['expected_version_mismatch'] is False, row
              assert row['auth'] not in ('signed-in', 'verified-by-probe'), row
              print('vendor-smoke', row['harness'] + ':', row['version'], '(auth', row['auth'] + ')')
          print('vendor mechanics verified: install, --version, required flag surfaces, no credential')
          "
      - name: Grok note (best-effort per plan section 16)
        run: echo "grok vendor smoke skipped — no verified non-interactive installer as of 2026-08-24; revisit on a new Grok CLI release (RISKS R27/R33)"
