# Project Steward configuration. Flat TOML only: on Python < 3.11 the steward
# CLI parses a documented flat subset (sections, strings, ints, floats,
# booleans, comments; no arrays, dates, or multiline values) —
# see the Project Steward plugin's own references/cross-platform.md, which is
# not part of this repository.

[session]
# auto_handoff_mode: "block" forces one auto-checkpoint before the agent
# stops when the handoff is stale; "remind" only warns; "off" disables.
auto_handoff_mode = "block"
auto_handoff_cooldown_min = 45
auto_handoff_min_edits = 5

[git]
# commit_policy: "ask" (propose only), "auto" (agent may run `wrap
# --commit`), "never".
commit_policy = "ask"
never_push = true

[backend]
name = "markdown"

[init]
run_project_scripts = false
